plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.4'
}

base {
    archivesName = project.archives_base_name
}
version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
}

repositories {
    mavenCentral()
    maven {
        name = 'babbaj-repo'
        url = 'https://babbaj.github.io/maven/'
    }
    maven {
        name = 'maxhenkel-repo'
        url = 'https://maven.maxhenkel.de/repository/public'
    }
    maven {
        name = 'shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Tungsten — pathfinder, built as a sibling Fabric mod project.
    implementation project(':tungsten')
    include project(':tungsten')

    // Jackson JSON
    implementation 'com.fasterxml.jackson.core:jackson-core:2.17.2'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.17.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    include 'com.fasterxml.jackson.core:jackson-core:2.17.2'
    include 'com.fasterxml.jackson.core:jackson-annotations:2.17.2'
    include 'com.fasterxml.jackson.core:jackson-databind:2.17.2'

    // Nether pathfinder
    implementation 'dev.babbaj:nether-pathfinder:1.5'
    include 'dev.babbaj:nether-pathfinder:1.5'

    // Voice chat API (compile-time only)
    compileOnly 'de.maxhenkel.voicechat:voicechat-api:2.6.0'

    // Py4j (Python bridge) — must be bundled; the AltoClef entrypoint references it directly.
    implementation 'net.sf.py4j:py4j:0.10.9.7'
    include 'net.sf.py4j:py4j:0.10.9.7'

    // Cloth Config — in-game settings screen.
    implementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    include "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"

    // ⛔ BARITONE IS A HARD DEPENDENCY *AND* IS BUNDLED, on purpose.
    //
    // `fabric.mod.json` declares it under `depends`, so Fabric refuses to launch without it.
    // Bundling is what makes that requirement survivable for a user who would not go and find it.
    // Fabric's own "Nested JARs" spec says this is the mechanism: nested jars let a mod "provide its
    // own dependencies, so Fabric Loader can pick the best version matching the dependencies instead
    // of requiring separate installation", and "only one version of a mod may be loaded at a time" —
    // so a player who ALREADY has their own Baritone gets no duplicate-mod conflict; the loader picks
    // the best version and ours is simply a floor.
    //
    // Bundled by processResources, NOT by Loom's `include`: `include` demands a module component and
    // refuses a raw file ("not a module component and has no capabilities"). The jar is written to
    // META-INF/jars/<name>.jar, and — this part is NOT optional — it is declared in the `jars` array
    // of fabric.mod.json. Fabric Loader discovers nested jars from that array; a jar that is only
    // present in META-INF/jars is invisible, and the game then fails at launch with "requires
    // baritone, which is missing". Loom merges its own `include` entries into the same array at build
    // time, so the hand-written entry sits alongside them. The one thing `include` would add is
    // REMAP, which is unnecessary: this is Baritone's RELEASED jar, already built for production
    // Fabric (intermediary). It is also not on the compile classpath — altoclef reaches Baritone
    // through reflection on its public API (see adris.altoclef.control.BaritoneBridge).
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property("version", project.version)
    inputs.property("mcVersion", project.minecraft_version)

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "mcVersion": project.minecraft_version
    }

    from(sourceSets.main.resources.srcDirs) {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        exclude "fabric.mod.json"
    }

    // ⛔ SHIP THE LICENCE IN THE JAR. GPL-3.0 asks that anyone who receives the Program gets a copy
    // of the licence, and the jar is what people actually download — the repository copy does not
    // travel with it. THIRD_PARTY_NOTICES.md rides along for the same reason: the bundled Jackson
    // artifacts are Apache-2.0, which requires their notice to be preserved wherever they are
    // redistributed.
    from('LICENSE') {
        into 'META-INF'
    }
    from('THIRD_PARTY_NOTICES.md') {
        into 'META-INF'
    }
    // Baritone ships inside this jar, so its own licence travels with it — LGPL-3.0 section 4 asks
    // for exactly that ("accompany the Combined Work with a copy of the GNU GPL and this license
    // document"), and the GPL-3.0 half is the LICENSE above.
    from('third_party_licenses/LGPL-3.0.txt') {
        into 'META-INF/licenses'
    }
    // Baritone itself — a Fabric nested JAR. See the note in `dependencies` for why this is done here
    // rather than with Loom's `include`, and why it needs no remapping.
    from('libs/baritone-api-fabric-1.19.0.jar') {
        into 'META-INF/jars'
    }
}
